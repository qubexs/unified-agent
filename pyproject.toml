[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "unified-agent"
version = "0.1.0"
description = "One app (CLI + desktop) combining persona agents, long-term memory, browser control, structured output and a coding-agent hook."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "pydantic>=2.6",
  "fastapi>=0.110",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.40"]
memory = ["mem0ai>=0.1"]
browser = ["browser-use>=0.11", "playwright", "pydantic-settings>=2.0"]
desktop = ["pywebview>=5"]
outlines = ["outlines", "transformers", "torch"]
dev = ["pytest>=8", "httpx>=0.27", "python-multipart"]
all = ["unified-agent[anthropic,openai,memory,browser,desktop]"]

[project.scripts]
ua = "unified_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["unified_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

